# Include inside the jyutdict.org server block, replacing its existing location /.
# Keep the existing exact API locations and security rules.
location = / {
    try_files /api/seo/page.php /index.html;
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root/api/seo/page.php;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
}
location = /index.html {
    return 301 https://jyutdict.org/$is_args$args;
}
location = /sitemap.xml {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root/api/seo/sitemap.php;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_read_timeout 60s;
}
location ~ ^/sitemaps/(?:pages|characters-[1-9][0-9]*)\.xml$ {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root/api/seo/sitemap.php;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_read_timeout 60s;
}
location / {
    try_files $uri @jyutdict_seo;
}
location @jyutdict_seo {
    try_files /api/seo/page.php /index.html;
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root/api/seo/page.php;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
}
