    <script>
        // Hash 模式 URL 重定向到 History 模式
        // 例如：/#/about → /about, /#/about#anchor → /about#anchor
        if (window.location.hash.startsWith('#/')) {
            const newPath = window.location.hash.slice(1);
            const anchorIndex = newPath.indexOf('#');
            let path = anchorIndex > -1 ? newPath.slice(0, anchorIndex) : newPath;
            let anchor = anchorIndex > -1 ? newPath.slice(anchorIndex) : '';
            window.location.replace(path + anchor);
        }
    </script>
